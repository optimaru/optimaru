# The `optimaru` Python distribution: the package in optimaru/, every use case a
# subpackage (optimaru.vehicle_routing, optimaru.school_timetabling, …) with its
# compiled `_core`. setup.py lists the extensions and their C++ sources.
[build-system]
requires = ["setuptools>=77", "pybind11>=2.13.6"]
build-backend = "setuptools.build_meta"

[project]
name = "optimaru"
version = "0.4.0"
description = "Metaheuristic optimization engine for routing, scheduling, timetabling and allocation — 22 ready-to-use models."
readme = "docs/pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# The compiled extensions embed pybind11 headers (BSD-3-Clause); its license
# is reproduced at the end of NOTICE, which ships with every wheel and the sdist.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "optimaru" }]
keywords = [
  "optimization", "combinatorial-optimization", "metaheuristics", "scheduling",
  "vehicle-routing", "timetabling", "operations-research", "solver",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
# Every use case's models.py (the JSON request and response models) is pydantic;
# the compiled solvers themselves import without it.
dependencies = ["pydantic>=2.5"]

[project.urls]
Homepage = "https://optimaru.com"
Source = "https://github.com/optimaru/optimaru"
Issues = "https://github.com/optimaru/optimaru/issues"

[tool.setuptools]
# Packages and ext_modules come from setup.py.
include-package-data = false

[dependency-groups]
dev = ["pytest", "numpy", "ruff"]

[tool.uv]
# Editable installs build the extensions in place (optimaru/<use case>/_core*.so);
# rebuild them when the C++ changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "optimaru/**/*.cpp" },
  { file = "optimaru/**/*.hpp" },
  { env = "OPTIMARU_USE_CASES" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_i686"
build-verbosity = 1
# Smoke test: every subpackage (and its compiled _core) imports from the installed wheel.
test-command = "python -c \"import optimaru; optimaru._import_all(); print(len(optimaru.__all__), 'use cases OK')\""

[tool.cibuildwheel.macos]
# Separate native builds per arch (arm64 runner, x86_64 runner).
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
