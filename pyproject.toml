# The `optimaru` Python distribution: the package in optimaru/, every use case a
# subpackage (optimaru.vehicle_routing, optimaru.school_timetabling, …) with its
# compiled `_core`. setup.py lists the extensions and their C++ sources.
[build-system]
requires = ["setuptools>=77", "pybind11>=2.13.6"]
build-backend = "setuptools.build_meta"

[project]
name = "optimaru"
version = "0.4.3"
description = "Metaheuristic optimization engine for routing, scheduling, timetabling and allocation — 22 ready-to-use models."
readme = "docs/pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# The compiled extensions embed pybind11 headers (BSD-3-Clause); its license
# is reproduced at the end of NOTICE. THIRD-PARTY-LICENSES covers the C++ runtime
# libraries the wheel repair tools bundle into the musllinux and Windows wheels.
# All three ship with every wheel and the sdist.
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-LICENSES"]
authors = [{ name = "optimaru" }]
keywords = [
  "optimization", "combinatorial-optimization", "metaheuristics", "scheduling",
  "vehicle-routing", "timetabling", "operations-research", "solver",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
# Every use case's models.py (the JSON request and response models) is pydantic, and importing a
# use case imports its models (all but school_timetabling, whose solve() takes dicts).
dependencies = ["pydantic>=2.11"]

[project.urls]
Homepage = "https://optimaru.com"
Source = "https://github.com/optimaru/optimaru"
Issues = "https://github.com/optimaru/optimaru/issues"

[tool.setuptools]
# Packages and ext_modules come from setup.py.
include-package-data = false

[dependency-groups]
dev = ["pytest", "numpy", { include-group = "lint" }]
# What CI's lint job runs. uv.lock pins the versions, so a local run formats as CI does.
lint = ["ruff", "clang-format"]

[tool.uv]
# Editable installs build the extensions in place (optimaru/<use case>/_core*.so);
# rebuild them when the C++ changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "optimaru/**/*.cpp" },
  { file = "optimaru/**/*.hpp" },
  { env = "OPTIMARU_USE_CASES" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# The excludes below also hold for a path named on the command line (pre-commit names every file).
force-exclude = true

[tool.ruff.format]
# Guide samples and notebook cells are laid out by hand for reading (aligned comments,
# several short entries on a line). Notebooks are still linted.
exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint]
# RUF022: every `__all__` is sorted, so a new name has one place to go.
select = ["E4", "E7", "E9", "F", "I", "RUF022"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# A notebook's import cell keeps its hand layout too (several names on a line).
"*.ipynb" = ["I001"]

[tool.ruff.lint.isort]
# This file configures ruff for the whole repository, benchmark projects included. Naming
# their packages here sorts an import the same way from any directory and any environment.
known-first-party = [
  "optimaru", "cpsat_plugins", "*_cpsat", "teacher_scheduling", "vrp_benchmark", "bench",
  "cpsat_quickstart", "dump_instances", "evaluate", "gen_canonical", "run_bench",
]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_i686"
build-verbosity = 1
# Smoke test: every subpackage (and its compiled _core) imports from the installed wheel.
test-command = "python -c \"import optimaru; optimaru._import_all(); print(len(optimaru.__all__), 'use cases OK')\""

[tool.cibuildwheel.macos]
# Separate native builds per arch (arm64 runner, x86_64 runner).
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
