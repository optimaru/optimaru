[project]
name = "tournament_scheduling"
version = "0.1.0"
description = "Tournament-scheduling C++ solver with Python bindings"
requires-python = ">=3.14,<4.0"
dependencies = []

[project.optional-dependencies]
models = ["pydantic>=2.5"]

[dependency-groups]
dev = [
    "pytest",
    "pybind11>=2.13.6",
    "setuptools>=61.0",
    "pydantic>=2.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[build-system]
requires = ["setuptools>=61.0", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tournament_scheduling*"]

[tool.setuptools.package-data]
tournament_scheduling = ["*.pyi", "py.typed"]
