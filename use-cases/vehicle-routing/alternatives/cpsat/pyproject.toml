[project]
name = "vehicle-routing-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for vehicle routing."
requires-python = ">=3.11,<4.0"
dependencies = ["cpsat-plugins", "vrp_routing", "ortools>=9.10", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["vehicle_routing_cpsat"]

[tool.uv.sources]
cpsat-plugins = { path = "../../../cpsat-common", editable = true }
vrp_routing = { path = "../../python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
