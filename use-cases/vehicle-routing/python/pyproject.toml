[project]
name = "vrp_routing"
version = "0.1.0"
description = "Vehicle-routing C++ solver with Python bindings"
requires-python = ">=3.11,<4.0"
dependencies = []

[project.optional-dependencies]
models = ["pydantic>=2.5"]

[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.13.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vrp_routing*"]

[tool.setuptools.package-data]
vrp_routing = ["*.pyi", "py.typed"]

# _constraint.py is a byte-identical copy of python/optimaru/_constraint.py
# (scripts/check_constraint_base.py keeps it in sync), formatted at 120 columns
# there; never reformat the copy here.
[tool.ruff]
extend-exclude = ["vrp_routing/_constraint.py"]

[dependency-groups]
dev = [
    "pytest",
    "pydantic>=2.5",
]
