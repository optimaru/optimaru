[project]
name = "bin_packing"
version = "0.1.0"
description = "Bin-packing model with a local-search solver"
requires-python = ">=3.14,<4.0"
dependencies = ["pydantic>=2.5"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.setuptools]
packages = ["bin_packing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
