[project]
name = "assembly-line-balancing"
version = "0.1.0"
description = "Assembly line balancing metaheuristic use case"
requires-python = ">=3.11,<4.0"
dependencies = ["pydantic>=2.5"]
[dependency-groups]
dev = ["pytest", "ruff"]
[tool.setuptools.packages.find]
include = ["assembly_line_balancing*"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
extend-select = ["I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
