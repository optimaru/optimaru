[project]
name = "food_packaging"
version = "0.1.0"
description = "Food-packaging C++ solver (C++ port) with Python bindings"
requires-python = ">=3.14,<4.0"
dependencies = []

[project.optional-dependencies]
models = ["pydantic>=2.5"]

[dependency-groups]
dev = [
    "pytest",
    "pybind11>=2.13.6",
    "setuptools>=61.0",
    "pydantic>=2.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pin the rule set explicitly (prevents default rule set drift across environments; the
# package uses naive datetimes on a shared origin, so the DTZ rules do not fit).
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["setuptools>=61.0", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["food_packaging*"]

[tool.setuptools.package-data]
food_packaging = ["*.pyi", "py.typed"]
