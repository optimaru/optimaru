[project]
name = "food_packaging"
version = "0.1.0"
description = "Food-packaging C++ solver (Timefold quickstart port) with Python bindings"
requires-python = ">=3.14,<4.0"
dependencies = []

[project.optional-dependencies]
models = ["pydantic>=2.5"]

[dependency-groups]
dev = [
    "pytest",
    "pybind11>=2.13.6",
    "setuptools>=61.0",
    "pydantic>=2.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 룰셋을 명시적으로 고정한다 (환경별 기본 룰셋 드리프트 방지; naive
# datetime 을 공통 기준시로 쓰는 패키지라 DTZ 계열은 맞지 않다).
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["setuptools>=61.0", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["food_packaging*"]

[tool.setuptools.package-data]
food_packaging = ["*.pyi", "py.typed"]
