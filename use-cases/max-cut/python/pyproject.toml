[project]
name = "max-cut"
version = "0.1.0"
description = "Max-Cut C++ solver with Python bindings"
requires-python = ">=3.11,<4.0"
# The canonical problem is a pydantic model (solve and with_initial_solution
# take it), so pydantic is a hard dependency here.
dependencies = ["pydantic>=2.5"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pybind11>=2.13.6",
    "setuptools>=61.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.13.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["max_cut*"]

[tool.setuptools.package-data]
max_cut = ["*.pyi", "py.typed"]
