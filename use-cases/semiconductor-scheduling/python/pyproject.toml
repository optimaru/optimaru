[project]
name = "semiconductor-scheduling"
version = "0.1.0"
description = "Semiconductor fab scheduling C++ solver with Python bindings"
requires-python = ">=3.11,<4.0"
# The Pydantic models are the primary API (the server and the web demo speak
# them), so pydantic stays a dependency.
dependencies = ["pydantic>=2.5"]

[dependency-groups]
dev = [
    "pytest",
    "pybind11>=2.13.6",
    "setuptools>=61.0",
    "pydantic>=2.5",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.13.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["semiconductor_scheduling*"]

[tool.setuptools.package-data]
semiconductor_scheduling = ["*.pyi", "py.typed"]
