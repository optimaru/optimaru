[project]
name = "maintenance_scheduling"
version = "0.1.0"
description = "Maintenance-scheduling C++ solver (C++ port) with Python bindings"
requires-python = ">=3.11,<4.0"
dependencies = []

[project.optional-dependencies]
models = ["pydantic>=2.5"]

[dependency-groups]
dev = [
    "pytest",
    "pybind11>=2.13.6",
    "setuptools>=61.0",
    "pydantic>=2.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E741"]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["setuptools>=61.0", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["maintenance_scheduling*"]

[tool.setuptools.package-data]
maintenance_scheduling = ["*.pyi", "py.typed"]
