[project]
name = "flight_crew"
version = "0.1.0"
description = "Flight-crew-scheduling C++ solver with Python bindings"
requires-python = ">=3.11,<4.0"
dependencies = []

[project.optional-dependencies]
models = ["pydantic>=2.5"]

[dependency-groups]
dev = [
    "pytest",
    "pybind11>=2.13.6",
    "setuptools>=61.0",
    "pydantic>=2.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pin the rule set explicitly (prevents ruff default rule set drift; the naive datetime
# == UTC convention means the DTZ rules do not fit this package).
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["setuptools>=61.0", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["flight_crew*"]

[tool.setuptools.package-data]
flight_crew = ["*.pyi", "py.typed"]
