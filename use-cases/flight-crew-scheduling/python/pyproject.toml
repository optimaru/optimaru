[project]
name = "flight_crew"
version = "0.1.0"
description = "Flight-crew-scheduling C++ solver with Python bindings"
requires-python = ">=3.14,<4.0"
dependencies = []

[project.optional-dependencies]
models = ["pydantic>=2.5"]

[dependency-groups]
dev = [
    "pytest",
    "pybind11>=2.13.6",
    "setuptools>=61.0",
    "pydantic>=2.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 룰셋을 명시적으로 고정한다 (ruff 기본 룰셋 드리프트 방지; naive datetime
# == UTC 관례라 DTZ 계열은 이 패키지에 맞지 않다).
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["setuptools>=61.0", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["flight_crew*"]

[tool.setuptools.package-data]
flight_crew = ["*.pyi", "py.typed"]
