[project]
name = "pdp_routing"
version = "0.1.0"
description = "Pickup-and-delivery (PDPTW) C++ solver with Python bindings"
requires-python = ">=3.14,<4.0"
dependencies = []

[project.optional-dependencies]
models = ["pydantic>=2"]

[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.13.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdp_routing*"]

[tool.setuptools.package-data]
pdp_routing = ["*.pyi", "py.typed"]

[dependency-groups]
dev = [
    "pytest",
]
