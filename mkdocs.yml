site_name: optimaru
site_description: Metaheuristic optimization engine for routing, scheduling, timetabling and allocation, with 22 ready-to-use models.
# The homepage builds the same site under its own /engine-docs/ and sets the URL.
site_url: !ENV [OPTIMARU_DOCS_SITE_URL, "https://optimaru.github.io/optimaru/"]
repo_url: https://github.com/optimaru/optimaru
repo_name: optimaru/optimaru
edit_uri: edit/main/docs/
copyright: Copyright 2026 The optimaru Authors. Apache-2.0.
# No theme credit in the footer: the site is also served under optimaru.com,
# which does not name third-party tools.
extra:
  generator: false

docs_dir: docs
extra_css:
  - stylesheets/optimaru.css
exclude_docs: |
  pypi.md
  requirements.txt

theme:
  name: material
  # The optimaru mark, as on optimaru.com, in place of the theme's own icons. The tab icon's ink
  # turns light when the browser is dark (assets/favicon.svg). The header's is drawn inline in
  # the header's text colour (overrides/.icons/optimaru/mark.svg), so it follows this site's own
  # light/dark toggle; the header is plain white or black with optimaru's green as the accent.
  custom_dir: overrides
  favicon: assets/favicon.svg
  icon:
    logo: optimaru/mark
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: green
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search
  # scripts/gen_docs_pages.py writes the API reference pages and the navigation
  # (SUMMARY.md) on every build, from the packages under optimaru/.
  - gen-files:
      scripts:
        - scripts/gen_docs_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          # Static analysis of the sources and the _core.pyi stubs: the docs
          # build needs no compiled extension.
          paths: [.]  # relative to this file
          options:
            allow_inspection: false
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_[^_]"]

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      # GitHub's heading anchors, so a #fragment works on GitHub and on the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: !relative $config_dir
      check_paths: true

# Broken links and anchors fail the strict build. Links that leave docs/ are
# rewritten to GitHub by scripts/mkdocs_hooks.py before validation.
validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
