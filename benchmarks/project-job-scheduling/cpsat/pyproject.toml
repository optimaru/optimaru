[project]
name = "project-job-scheduling-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for project job scheduling."
requires-python = ">=3.11,<4.0"
dependencies = [
    "external-solver",
    "cpsat-plugins",
    "optimaru",
    "ortools>=9.10",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
project-job-scheduling-compare = "project_job_scheduling_cpsat.benchmark:main"
project-job-scheduling-public-bench = "project_job_scheduling_cpsat.public_benchmark:main"

[tool.uv]
# external-solver pins the published optimaru; the benchmarks measure the engine in
# this checkout instead (the path source below, checked by cpsat_plugins.checkout).
override-dependencies = ["optimaru"]

[tool.uv.sources]
external-solver = { git = "https://github.com/optimaru/external-solver", tag = "v0.3.0" }
optimaru = { path = "../../..", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }

[tool.setuptools]
packages = ["project_job_scheduling_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
