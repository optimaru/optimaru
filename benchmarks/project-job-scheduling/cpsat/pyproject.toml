[project]
name = "project-job-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for project job scheduling."
requires-python = ">=3.11,<4.0"
dependencies = [
    "cpsat-plugins",
    "project_job",
    "ortools>=9.10",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
project-job-compare = "project_job_cpsat.benchmark:main"
project-job-public-bench = "project_job_cpsat.public_benchmark:main"

[tool.uv.sources]
project_job = { path = "../../../use-cases/project-job-scheduling/python", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }

[tool.setuptools]
packages = ["project_job_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
