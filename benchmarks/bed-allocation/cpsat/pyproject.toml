[project]
name = "bed-allocation-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for bed allocation."
requires-python = ">=3.14,<4.0"
dependencies = [
    "cpsat-plugins",
    "bed_allocation",
    "ortools>=9.10",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bed-allocation-compare = "bed_allocation_cpsat.benchmark:main"

[tool.uv.sources]
bed_allocation = { path = "../../../use-cases/bed-allocation/python", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }

[tool.setuptools]
packages = ["bed_allocation_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
