[project]
name = "vrp-benchmark"
version = "0.1.0"
description = "CVRPLIB benchmark harness: the optimaru VRP engine beside CP-SAT and PyVRP."
requires-python = ">=3.11,<4.0"
dependencies = ["vrp_routing", "vehicle-routing-cpsat", "pydantic>=2"]

[project.scripts]
vrp-public-bench = "vrp_benchmark.public_benchmark:main"

[project.optional-dependencies]
dev = ["pytest"]
# PyVRP beside the local backends (`--backend pyvrp`). solve_pyvrp reads
# 0.14's Route/Client/Location shapes; a minor bump is a deliberate change,
# not a lock refresh.
bench = ["pyvrp>=0.14,<0.15", "numpy"]

[tool.setuptools]
packages = ["vrp_benchmark"]

[tool.uv.sources]
vrp_routing = { path = "../../use-cases/vehicle-routing/python", editable = true }
vehicle-routing-cpsat = { path = "../../use-cases/vehicle-routing/alternatives/cpsat", editable = true }
cpsat-plugins = { path = "../../use-cases/cpsat-common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
