[project]
name = "task-assigning-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for task assigning."
requires-python = ">=3.11,<4.0"
dependencies = ["external-solver", "optimaru", "cpsat-plugins>=0.1.0", "ortools>=9.10", "pydantic>=2"]

[project.scripts]
task-assigning-compare = "task_assigning_cpsat.benchmark:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["task_assigning_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# external-solver pins the published optimaru; the benchmarks measure the engine in
# this checkout instead (the path source below, checked by cpsat_plugins.checkout).
override-dependencies = ["optimaru"]

[tool.uv.sources]
external-solver = { git = "https://github.com/optimaru/external-solver", tag = "v0.2.3" }
optimaru = { path = "../../..", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
