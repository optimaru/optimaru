[project]
name = "sports-league-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for sports league scheduling."
requires-python = ">=3.11,<4.0"
dependencies = ["external-solver", "optimaru", "cpsat-plugins>=0.1.0", "ortools>=9.10", "pydantic>=2"]

[project.scripts]
sports-league-compare = "sports_league_cpsat.benchmark:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["sports_league_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# external-solver pins the published optimaru; the benchmarks measure the engine in
# this checkout instead (the path source below, checked by cpsat_plugins.checkout).
override-dependencies = ["optimaru"]

[tool.uv.sources]
external-solver = { git = "https://github.com/optimaru/external-solver", tag = "v0.2.2" }
optimaru = { path = "../../..", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }
