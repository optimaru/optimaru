[project]
name = "st-bench"
version = "0.0.0"
description = "school-timetabling three-way benchmark harness (C++ engine vs OR-Tools CP-SAT vs Java Timefold)"
requires-python = ">=3.14,<4.0"
dependencies = [
    # Track 1 CP-SAT model + track 2 teacher_scheduling (benchmarks/school-timetabling/cpsat) dependencies.
    "ortools>=9.15,<10",
    "pydantic>=2.13.2,<3",
    "pydantic-settings>=2.4.0,<3",
]

[tool.uv]
# A collection of scripts, not installed as a package (uv run only manages the venv).
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E741"]
extend-select = ["I"]

[tool.ruff.lint.isort]
# Script modules in the same directory (so isort does not mistake them for third-party).
known-first-party = ["cpsat_quickstart", "evaluate", "gen_canonical", "run_bench"]
