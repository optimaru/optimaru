[project]
name = "school-timetabling-cpsat"
version = "0.0.0"
description = "CP-SAT timetabling model (teacher_scheduling) and the engine vs CP-SAT comparison for school timetabling"
requires-python = ">=3.11,<4.0"
dependencies = [
    "ortools>=9.15,<10",
    "pydantic>=2.13.2,<3",
    # The constraint specs and their defaults (constraint_info()): the registry subclasses the
    # engine's specs, so both solvers share one name and one default per constraint.
    "optimaru",
]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[project.scripts]
school-timetabling-compare = "school_timetabling_cpsat.benchmark:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["teacher_scheduling*", "school_timetabling_cpsat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
optimaru = { path = "../../..", editable = true }
