[project]
name = "teacher-scheduling"
version = "0.0.0"
description = "CP-SAT timetabling engine for middle/high-school teacher timetables"
requires-python = ">=3.11,<4.0"
dependencies = [
    "ortools>=9.15,<10",
    "pydantic>=2.13.2,<3",
    "pydantic-settings>=2.4.0,<3",
    # Reading/writing Korean teacher load table workbooks (teacher_scheduling.excel / .export)
    "openpyxl>=3.1,<4",
    # The constraint specs and their defaults (constraint_info()): the registry subclasses the
    # engine's specs, so both solvers share one name and one default per constraint.
    "optimaru",
]

[dependency-groups]
test = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["teacher_scheduling*"]

[tool.uv.sources]
optimaru = { path = "../../..", editable = true }
