[project]
name = "max-cut-cpsat"
version = "0.1.0"
description = "Exact CP-SAT backend for Max-Cut"
requires-python = ">=3.11,<4.0"
dependencies = ["cpsat-plugins>=0.1.0", "max-cut", "ortools>=9.10", "pydantic>=2.5"]
[dependency-groups]
dev = ["pytest", "ruff"]
[project.scripts]
max-cut-compare = "max_cut_cpsat.benchmark:main"

[tool.uv.sources]
cpsat-plugins = { path = "../../cpsat-common", editable = true }
max-cut = { path = "../../../use-cases/max-cut/python", editable = true }
[tool.setuptools.packages.find]
include = ["max_cut_cpsat*"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
extend-select = ["I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
