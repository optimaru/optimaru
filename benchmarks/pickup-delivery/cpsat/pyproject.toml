[project]
name = "pickup-delivery-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for pickup and delivery."
requires-python = ">=3.11,<4.0"
dependencies = ["external-solver", "cpsat-plugins", "optimaru", "ortools>=9.10", "pydantic>=2"]

[project.scripts]
pickup-delivery-public-bench = "pickup_delivery_cpsat.public_benchmark:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["pickup_delivery_cpsat"]

[tool.uv]
# external-solver pins the published optimaru; the benchmarks measure the engine in
# this checkout instead (the path source below, checked by cpsat_plugins.checkout).
override-dependencies = ["optimaru"]

[tool.uv.sources]
external-solver = { git = "https://github.com/optimaru/external-solver", tag = "v0.2.3" }
cpsat-plugins = { path = "../../cpsat-common", editable = true }
optimaru = { path = "../../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
