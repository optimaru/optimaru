[project]
name = "employee-scheduling-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for employee scheduling."
requires-python = ">=3.14,<4.0"
dependencies = [
    "cpsat-plugins",
    "es_scheduling[models]",
    "ortools>=9.10",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
employee-scheduling-compare = "employee_scheduling_cpsat.benchmark:main"

[tool.uv.sources]
es_scheduling = { path = "../../../use-cases/employee-scheduling/python", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }

[tool.setuptools]
packages = ["employee_scheduling_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
