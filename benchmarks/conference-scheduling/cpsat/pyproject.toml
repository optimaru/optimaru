[project]
name = "conference-scheduling-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for conference scheduling."
requires-python = ">=3.11,<4.0"
dependencies = ["external-solver", "conference_scheduling[models]", "cpsat-plugins>=0.1.0", "ortools>=9.10", "pydantic>=2"]

[project.scripts]
conference-scheduling-compare = "conference_scheduling_cpsat.benchmark:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["conference_scheduling_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# external-solver depends on the published optimaru; the benchmarks measure the
# engine in this checkout instead (cpsat_plugins.checkout), so it is not installed.
override-dependencies = ["optimaru; sys_platform == 'never'"]

[tool.uv.sources]
external-solver = { git = "https://github.com/optimaru/external-solver", tag = "v0.1.0" }
conference_scheduling = { path = "../../../use-cases/conference-scheduling/python", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }
