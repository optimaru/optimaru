[project]
name = "bin-packing-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for bin packing"
requires-python = ">=3.11,<4.0"
dependencies = [
    "bin_packing",
    "cpsat-plugins",
    "ortools>=9.10",
    "pydantic>=2.5",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
bin_packing = { path = "../../../use-cases/bin-packing/python", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }

[tool.setuptools]
packages = ["bin_packing_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
