[project]
name = "bin-packing-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT reference for the bin-packing use case."
requires-python = ">=3.11,<4.0"
dependencies = [
    "external-solver",
    "optimaru",
    "cpsat-plugins",
    "ortools>=9.10",
    "pydantic>=2.5",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
bin-packing-compare = "bin_packing_cpsat.benchmark:main"
bin-packing-public-bench = "bin_packing_cpsat.public_benchmark:main"
bin-packing-quality-bench = "bin_packing_cpsat.quality_bench:main"

[tool.uv]
# external-solver pins the published optimaru; the benchmarks measure the engine in
# this checkout instead (the path source below, checked by cpsat_plugins.checkout).
override-dependencies = ["optimaru"]

[tool.uv.sources]
external-solver = { git = "https://github.com/optimaru/external-solver", tag = "v0.3.0" }
optimaru = { path = "../../..", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }

[tool.setuptools]
packages = ["bin_packing_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
