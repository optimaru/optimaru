[project]
name = "facility-location-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for the facility-location use case."
requires-python = ">=3.11,<4.0"
dependencies = [
    "cpsat-plugins",
    "facility_location",
    "ortools>=9.10",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
facility-location-compare = "facility_location_cpsat.benchmark:main"

[tool.uv.sources]
facility_location = { path = "../../../use-cases/facility-location/python", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }

[tool.setuptools]
packages = ["facility_location_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
