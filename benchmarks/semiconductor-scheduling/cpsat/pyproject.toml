[project]
name = "semiconductor-scheduling-cpsat"
version = "0.1.0"
description = "Exact CP-SAT backend for semiconductor fab scheduling"
requires-python = ">=3.11,<4.0"
dependencies = ["external-solver", "cpsat-plugins>=0.1.0", "semiconductor-scheduling", "ortools>=9.10", "pydantic>=2.5"]
[dependency-groups]
dev = ["pytest", "ruff"]
[project.scripts]
semiconductor-scheduling-compare = "semiconductor_scheduling_cpsat.benchmark:main"

[tool.uv]
# external-solver depends on the published optimaru; the benchmarks measure the
# engine in this checkout instead (cpsat_plugins.checkout), so it is not installed.
override-dependencies = ["optimaru; sys_platform == 'never'"]

[tool.uv.sources]
external-solver = { git = "https://github.com/optimaru/external-solver", tag = "v0.1.0" }
cpsat-plugins = { path = "../../cpsat-common", editable = true }
semiconductor-scheduling = { path = "../../../use-cases/semiconductor-scheduling/python", editable = true }
[tool.setuptools.packages.find]
include = ["semiconductor_scheduling_cpsat*"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
extend-select = ["I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
