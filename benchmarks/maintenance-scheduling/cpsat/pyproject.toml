[project]
name = "maintenance-scheduling-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for maintenance scheduling."
requires-python = ">=3.14,<4.0"
dependencies = [
    "cpsat-plugins",
    "maintenance_scheduling",
    "ortools>=9.10",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
maintenance-scheduling-compare = "maintenance_scheduling_cpsat.benchmark:main"

[tool.uv.sources]
maintenance_scheduling = { path = "../../../use-cases/maintenance-scheduling/python", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }

[tool.setuptools]
packages = ["maintenance_scheduling_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
