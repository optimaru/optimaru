[project]
name = "quadratic-assignment-cpsat"
version = "0.1.0"
description = "Exact CP-SAT backend for quadratic assignment"
requires-python = ">=3.11,<4.0"
dependencies = ["external-solver", "cpsat-plugins>=0.1.0", "optimaru", "ortools>=9.10", "pydantic>=2.5"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
quadratic-assignment-compare = "quadratic_assignment_cpsat.benchmark:main"

[tool.uv]
# external-solver pins the published optimaru; the benchmarks measure the engine in
# this checkout instead (the path source below, checked by cpsat_plugins.checkout).
override-dependencies = ["optimaru"]

[tool.uv.sources]
external-solver = { git = "https://github.com/optimaru/external-solver", tag = "v0.2.2" }
cpsat-plugins = { path = "../../cpsat-common", editable = true }
optimaru = { path = "../../..", editable = true }

[tool.setuptools.packages.find]
include = ["quadratic_assignment_cpsat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
