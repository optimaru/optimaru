[project]
name = "food-packaging-cpsat"
version = "0.1.0"
description = "OR-Tools CP-SAT backend for food packaging."
requires-python = ">=3.11,<4.0"
dependencies = ["food_packaging[models]", "cpsat-plugins>=0.1.0", "ortools>=9.10", "pydantic>=2"]

[project.scripts]
food-packaging-compare = "food_packaging_cpsat.benchmark:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["food_packaging_cpsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
food_packaging = { path = "../../../use-cases/food-packaging/python", editable = true }
cpsat-plugins = { path = "../../cpsat-common", editable = true }
