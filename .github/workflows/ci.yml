name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  use-case-cpp:
    name: ${{ matrix.use_case }} (C++)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use_case:
          - bed-allocation
          - conference-scheduling
          - facility-location
          - flight-crew-scheduling
          - food-packaging
          - maintenance-scheduling
          - meeting-scheduling
          - order-picking
          - pickup-delivery
          - project-job-scheduling
          - school-timetabling
          - sports-league-scheduling
          - task-assigning
          - tournament-scheduling
          - vehicle-routing
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-${{ matrix.use_case }}
      - name: Configure
        run: >-
          cmake -S use-cases/${{ matrix.use_case }}/cpp -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  use-case-python:
    name: ${{ matrix.use_case }} (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use_case:
          - assembly-line-balancing
          - bed-allocation
          - bin-packing
          - conference-scheduling
          - facility-location
          - flight-crew-scheduling
          - food-packaging
          - knapsack
          - maintenance-scheduling
          - max-cut
          - meeting-scheduling
          - order-picking
          - pickup-delivery
          - project-job-scheduling
          - quadratic-assignment
          - school-timetabling
          - semiconductor-scheduling
          - sports-league-scheduling
          - task-assigning
          - tournament-scheduling
          - vehicle-routing
    defaults:
      run:
        working-directory: use-cases/${{ matrix.use_case }}/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: py-${{ matrix.use_case }}
      - name: Install (builds the C++ extension)
        run: uv sync --python 3.14 --all-groups --all-extras
        env:
          CC: ccache cc
          CXX: ccache c++
      - name: Test
        run: uv run --python 3.14 --with pytest python -m pytest -q tests

  benchmark-cpsat:
    name: ${{ matrix.benchmark }} (CP-SAT benchmark)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - cpsat-common
          - assembly-line-balancing
          - bed-allocation
          - bin-packing
          - conference-scheduling
          - facility-location
          - flight-crew-scheduling
          - food-packaging
          - knapsack
          - maintenance-scheduling
          - max-cut
          - meeting-scheduling
          - order-picking
          - pickup-delivery
          - project-job-scheduling
          - quadratic-assignment
          - school-timetabling
          - semiconductor-scheduling
          - sports-league-scheduling
          - task-assigning
          - tournament-scheduling
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bench-${{ matrix.benchmark }}
      - name: Locate the project
        run: |
          if [ -f benchmarks/${{ matrix.benchmark }}/cpsat/pyproject.toml ]; then
            echo "PROJECT=benchmarks/${{ matrix.benchmark }}/cpsat" >> "$GITHUB_ENV"
          else
            echo "PROJECT=benchmarks/${{ matrix.benchmark }}" >> "$GITHUB_ENV"
          fi
      - name: Install (builds the engine extension)
        run: uv sync --project "$PROJECT" --python 3.14 --all-groups --all-extras
        env:
          CC: ccache cc
          CXX: ccache c++
      - name: Test
        working-directory: ${{ env.PROJECT }}
        run: uv run --python 3.14 --with pytest python -m pytest -q tests
      - name: Engine vs CP-SAT smoke run
        working-directory: ${{ env.PROJECT }}
        run: |
          runner=$(ls *_cpsat/benchmark.py 2>/dev/null | head -1)
          if [ -z "$runner" ]; then echo "no comparison runner"; exit 0; fi
          uv run --python 3.14 python -m "$(dirname "$runner").benchmark" --seconds 1 --workers 2 --cpsat-grace 20

  vehicle-routing-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/vehicle-routing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.14 --extra dev
      - name: Test
        run: uv run --python 3.14 pytest -q
