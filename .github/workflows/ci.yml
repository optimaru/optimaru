name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every benchmark job, whatever changed (a pull request runs only the ones its files touch).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The use cases, read off the repository: a subpackage of optimaru/ with a _core.pyi
  # stub, which is what setup.py builds. The three matrices below take their lists from
  # here, so a new use case is built and tested without a line in this file.
  #
  # The benchmark jobs run on a pull request whose files touch them (the rule is in the
  # list step), and on a manual run; not on a push to main, which only refreshes the build
  # caches every pull request reads.
  use-cases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      names: ${{ steps.list.outputs.names }}
      benchmarks: ${{ steps.list.outputs.benchmarks }}
      vehicle_routing_benchmark: ${{ steps.list.outputs.vehicle_routing_benchmark }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the stubs: every matrix job waits for this one.
          sparse-checkout: optimaru/*/_core.pyi
          sparse-checkout-cone-mode: false
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          shopt -s nullglob
          names=$(for stub in optimaru/*/_core.pyi; do basename "$(dirname "$stub")"; done | jq -R . | jq -sc .)
          [ "$(jq length <<<"$names")" -gt 0 ] || { echo "no use case found: optimaru/*/_core.pyi matched nothing"; exit 1; }
          echo "names=$names" >> "$GITHUB_OUTPUT"
          # The CP-SAT comparisons: the shared runner, then every use case but vehicle
          # routing, whose comparison (OR-Tools Routing) is the vehicle-routing-benchmark job.
          benchmarks=$(jq -c '["cpsat-common"] + [.[] | gsub("_"; "-") | select(. != "vehicle-routing")]' <<<"$names")
          # Which of them run. A pull request: a comparison whose benchmark project or use case
          # it changes (a renamed file counts at both paths), and all of them when it changes
          # the shared runner, this file, or the Python and build files every benchmark project
          # installs (optimaru/*.py, setup.py, pyproject.toml). The C++ engine is left out on
          # purpose: its changes reach the benchmarks through the use-case Python jobs, which
          # run on every pull request. A push to main: none. A manual run: all.
          changed='[]'; all=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              changed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)' | jq -R . | jq -sc .)
              ;;
            workflow_dispatch) all=true ;;
          esac
          touched='def touches($slug): ($slug | gsub("-"; "_")) as $name
            | any($changed[]; startswith("benchmarks/\($slug)/") or startswith("optimaru/\($name)/"));
            def everything: $all or any($changed[]; startswith("benchmarks/cpsat-common/")
              or test("^optimaru/[^/]+\\.py$") or IN(".github/workflows/ci.yml", "setup.py", "pyproject.toml"));'
          benchmarks=$(jq -c --argjson changed "$changed" --argjson all "$all" "$touched"' [.[] | select(everything or touches(.))]' <<<"$benchmarks")
          vehicle_routing=$(jq -n --argjson changed "$changed" --argjson all "$all" "$touched"' everything or touches("vehicle-routing")')
          echo "benchmarks=$benchmarks" >> "$GITHUB_OUTPUT"
          echo "vehicle_routing_benchmark=$vehicle_routing" >> "$GITHUB_OUTPUT"
          echo "use cases: $names"; echo "benchmarks to run: $benchmarks"; echo "vehicle routing benchmark: $vehicle_routing"

  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPTIMARU_USE_CASES=none
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Engine license headers present
        run: python3 scripts/check_license_headers.py
      - uses: astral-sh/setup-uv@v5
      - name: Constraint-spec base, shared solve steps, use-case lists and the benchmark publisher (pure Python, no extension needed)
        run: uv run --no-project --python 3.14 --with pytest --with numpy python -m pytest -q tests/test_constraint.py tests/test_layout.py tests/test_solve_helpers.py tests/test_publish_benchmarks.py

  # ruff and clang-format at the versions uv.lock pins (the `lint` dependency group);
  # CONTRIBUTING.md has the commands that fix what this job reports.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install ruff and clang-format (no extension build)
        run: uv sync --python 3.14 --only-group lint
      - name: Python lint
        run: uv run --no-sync ruff check .
      - name: Python format
        run: uv run --no-sync ruff format --check .
      - name: C++ format
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 uv run --no-sync clang-format --dry-run --Werror

  # The release path, which wheels.yml only exercises on a version bump: the sdist
  # must carry every source, and a wheel built from it must import.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the sdist
        run: uvx --python 3.14 --from build pyproject-build --sdist -o dist .
      - name: The sdist has every file a wheel build needs, and no tests
        run: python3 scripts/check_sdist.py dist/*.tar.gz
      - name: Build a wheel from the sdist (one extension) and import it
        env:
          OPTIMARU_USE_CASES: knapsack
        run: |
          uv run --no-project --python 3.14 --with pip python -m pip wheel --no-deps -w wheelhouse dist/*.tar.gz
          cd "$RUNNER_TEMP"
          uv run --no-project --python 3.14 --with "$GITHUB_WORKSPACE"/wheelhouse/*.whl --with pydantic \
            python -c "import optimaru, optimaru.knapsack as k; assert 'knapsack_capacity_cost' in k.list_constraints(); print(optimaru.__file__)"

  use-case-cpp:
    name: ${{ matrix.use_case }} (C++)
    needs: use-cases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use_case: ${{ fromJSON(needs.use-cases.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-${{ matrix.use_case }}
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DOPTIMARU_ENGINE_TESTS=OFF -DOPTIMARU_USE_CASES=${{ matrix.use_case }}
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  use-case-python:
    name: ${{ matrix.use_case }} (Python)
    needs: use-cases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use_case: ${{ fromJSON(needs.use-cases.outputs.names) }}
    env:
      # setup.py builds only this use case's extension.
      OPTIMARU_USE_CASES: ${{ matrix.use_case }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: py-${{ matrix.use_case }}
      - name: Install (builds the C++ extension)
        run: uv sync --python 3.14 --all-groups
        env:
          CC: ccache cc
          CXX: ccache c++
      # The contract tests are parametrized over every use case and skip the ones this job did not build.
      - name: Test (the use case, and the contracts every use case shares)
        run: >-
          uv run --python 3.14 python -m pytest -q tests/${{ matrix.use_case }}
          tests/test_solve_contract.py tests/test_solver_config_contract.py tests/test_constraints_contract.py

  benchmark-cpsat:
    name: ${{ matrix.benchmark }} (CP-SAT benchmark)
    needs: use-cases
    if: needs.use-cases.outputs.benchmarks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark: ${{ fromJSON(needs.use-cases.outputs.benchmarks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bench-${{ matrix.benchmark }}
      - name: Locate the project
        run: |
          # setup.py builds only the benchmarked use case's extension
          # (cpsat-common is the shared runner, not a use case).
          slug="${{ matrix.benchmark }}"
          if [ "$slug" != cpsat-common ]; then echo "OPTIMARU_USE_CASES=${slug//-/_}" >> "$GITHUB_ENV"; fi
          if [ -f benchmarks/${{ matrix.benchmark }}/cpsat/pyproject.toml ]; then
            echo "PROJECT=benchmarks/${{ matrix.benchmark }}/cpsat" >> "$GITHUB_ENV"
          else
            echo "PROJECT=benchmarks/${{ matrix.benchmark }}" >> "$GITHUB_ENV"
          fi
      - name: Install (builds the engine extension)
        run: uv sync --project "$PROJECT" --python 3.14
        env:
          CC: ccache cc
          CXX: ccache c++
      - name: Test
        working-directory: ${{ env.PROJECT }}
        run: uv run --python 3.14 --with pytest python -m pytest -q tests
      - name: The C++ bench reads what dump_instances.py writes
        # Conference and meeting scheduling: the bench scores a fixed assignment of every
        # dumped instance, and the score must equal the use case's own (--check).
        # School timetabling: track 1's C++ bench scores the cross-check instance as its
        # evaluator does (the gate before track 1), then solves the S instance for a second.
        run: |
          case "${{ matrix.benchmark }}" in
            conference-scheduling|meeting-scheduling) ;;
            school-timetabling)
              cmake -B build/bench -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DOPTIMARU_ENGINE_TESTS=OFF -DOPTIMARU_USE_CASES=school_timetabling
              cmake --build build/bench -j --target st_quality_bench
              cd "$PROJECT"
              uv run --python 3.14 school-timetabling-compare --sizes S --seconds 1 --workers 2 \
                --cpp-bin "$GITHUB_WORKSPACE/build/bench/school_timetabling/st_quality_bench" --out-dir "$RUNNER_TEMP/st1"
              exit 0
              ;;
            *) echo "no dump with --check"; exit 0 ;;
          esac
          script="benchmarks/${{ matrix.benchmark }}/dump_instances.py"
          target=$(basename benchmarks/${{ matrix.benchmark }}/cpp/*_quality_bench.cpp .cpp)
          cmake -B build/bench -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPTIMARU_ENGINE_TESTS=OFF -DOPTIMARU_USE_CASES="$OPTIMARU_USE_CASES"
          cmake --build build/bench -j --target "$target"
          uv run --project "$PROJECT" --python 3.14 python "$script" "$RUNNER_TEMP/dump" \
            --check "build/bench/$OPTIMARU_USE_CASES/$target"
      - name: Engine vs CP-SAT smoke run
        working-directory: ${{ env.PROJECT }}
        run: |
          runner=$(ls *_cpsat/benchmark.py 2>/dev/null | head -1)
          if [ -z "$runner" ]; then echo "no comparison runner"; exit 0; fi
          # School timetabling's runner has its own tracks and flags: track 2 (engine vs CP-SAT on the
          # canonical model) at size S; tracks 1 and 3 run in school-timetabling-bench.yml.
          if [ "${{ matrix.benchmark }}" = school-timetabling ]; then
            uv run --python 3.14 school-timetabling-compare --track2 --sizes S --seconds 1 --workers 2 --out-dir "$RUNNER_TEMP/st"
            exit 0
          fi
          # One instance per scale: the seeds a ladder repeats a scale on add time, not paths.
          uv run --python 3.14 python -m "$(dirname "$runner").benchmark" --seconds 1 --workers 2 --cpsat-grace 20 --one-per-scale

  vehicle-routing-benchmark:
    needs: use-cases
    if: needs.use-cases.outputs.vehicle_routing_benchmark == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/vehicle-routing
    env:
      OPTIMARU_USE_CASES: vehicle_routing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.14
      - name: Test
        run: uv run --python 3.14 pytest -q
