name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The use cases, read off the repository: a subpackage of optimaru/ with a _core.pyi
  # stub, which is what setup.py builds. The three matrices below take their lists from
  # here, so a new use case is built and tested without a line in this file.
  use-cases:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
      benchmarks: ${{ steps.list.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the stubs: every matrix job waits for this one.
          sparse-checkout: optimaru/*/_core.pyi
          sparse-checkout-cone-mode: false
      - id: list
        run: |
          shopt -s nullglob
          names=$(for stub in optimaru/*/_core.pyi; do basename "$(dirname "$stub")"; done | jq -R . | jq -sc .)
          [ "$(jq length <<<"$names")" -gt 0 ] || { echo "no use case found: optimaru/*/_core.pyi matched nothing"; exit 1; }
          echo "names=$names" >> "$GITHUB_OUTPUT"
          # The CP-SAT comparisons: the shared runner, then every use case but vehicle
          # routing, whose comparison (OR-Tools Routing) is the vehicle-routing-benchmark job.
          benchmarks=$(jq -c '["cpsat-common"] + [.[] | gsub("_"; "-") | select(. != "vehicle-routing")]' <<<"$names")
          echo "benchmarks=$benchmarks" >> "$GITHUB_OUTPUT"
          echo "$names"; echo "$benchmarks"

  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPTIMARU_USE_CASES=none
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Engine license headers present
        run: python3 scripts/check_license_headers.py
      - uses: astral-sh/setup-uv@v5
      - name: Constraint-spec base, shared solve steps, use-case lists and the benchmark publisher (pure Python, no extension needed)
        run: uv run --no-project --python 3.14 --with pytest --with numpy python -m pytest -q tests/test_constraint.py tests/test_layout.py tests/test_solve_helpers.py tests/test_publish_benchmarks.py

  # ruff and clang-format at the versions uv.lock pins (the `lint` dependency group);
  # CONTRIBUTING.md has the commands that fix what this job reports.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install ruff and clang-format (no extension build)
        run: uv sync --python 3.14 --only-group lint
      - name: Python lint
        run: uv run --no-sync ruff check .
      - name: Python format
        run: uv run --no-sync ruff format --check .
      - name: C++ format
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 uv run --no-sync clang-format --dry-run --Werror

  # The release path, which wheels.yml only exercises on a version bump: the sdist
  # must carry every source, and a wheel built from it must import.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the sdist
        run: uvx --python 3.14 --from build pyproject-build --sdist -o dist .
      - name: The sdist has every file a wheel build needs, and no tests
        run: python3 scripts/check_sdist.py dist/*.tar.gz
      - name: Build a wheel from the sdist (one extension) and import it
        env:
          OPTIMARU_USE_CASES: knapsack
        run: |
          uv run --no-project --python 3.14 --with pip python -m pip wheel --no-deps -w wheelhouse dist/*.tar.gz
          cd "$RUNNER_TEMP"
          uv run --no-project --python 3.14 --with "$GITHUB_WORKSPACE"/wheelhouse/*.whl --with pydantic \
            python -c "import optimaru, optimaru.knapsack as k; assert 'knapsack_capacity_cost' in k.list_constraints(); print(optimaru.__file__)"

  use-case-cpp:
    name: ${{ matrix.use_case }} (C++)
    needs: use-cases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use_case: ${{ fromJSON(needs.use-cases.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-${{ matrix.use_case }}
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DOPTIMARU_ENGINE_TESTS=OFF -DOPTIMARU_USE_CASES=${{ matrix.use_case }}
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  use-case-python:
    name: ${{ matrix.use_case }} (Python)
    needs: use-cases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use_case: ${{ fromJSON(needs.use-cases.outputs.names) }}
    env:
      # setup.py builds only this use case's extension.
      OPTIMARU_USE_CASES: ${{ matrix.use_case }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: py-${{ matrix.use_case }}
      - name: Install (builds the C++ extension)
        run: uv sync --python 3.14 --all-groups
        env:
          CC: ccache cc
          CXX: ccache c++
      # The contract tests are parametrized over every use case and skip the ones this job did not build.
      - name: Test (the use case, and the contracts every use case shares)
        run: >-
          uv run --python 3.14 python -m pytest -q tests/${{ matrix.use_case }}
          tests/test_solve_contract.py tests/test_solver_config_contract.py tests/test_constraints_contract.py

  benchmark-cpsat:
    name: ${{ matrix.benchmark }} (CP-SAT benchmark)
    needs: use-cases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark: ${{ fromJSON(needs.use-cases.outputs.benchmarks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bench-${{ matrix.benchmark }}
      - name: Locate the project
        run: |
          # setup.py builds only the benchmarked use case's extension
          # (cpsat-common is the shared runner, not a use case).
          slug="${{ matrix.benchmark }}"
          if [ "$slug" != cpsat-common ]; then echo "OPTIMARU_USE_CASES=${slug//-/_}" >> "$GITHUB_ENV"; fi
          if [ -f benchmarks/${{ matrix.benchmark }}/cpsat/pyproject.toml ]; then
            echo "PROJECT=benchmarks/${{ matrix.benchmark }}/cpsat" >> "$GITHUB_ENV"
          else
            echo "PROJECT=benchmarks/${{ matrix.benchmark }}" >> "$GITHUB_ENV"
          fi
      - name: Install (builds the engine extension)
        run: uv sync --project "$PROJECT" --python 3.14 --all-groups --all-extras
        env:
          CC: ccache cc
          CXX: ccache c++
      - name: Test
        working-directory: ${{ env.PROJECT }}
        run: uv run --python 3.14 --with pytest python -m pytest -q tests
      - name: Engine vs CP-SAT smoke run
        working-directory: ${{ env.PROJECT }}
        run: |
          runner=$(ls *_cpsat/benchmark.py 2>/dev/null | head -1)
          if [ -z "$runner" ]; then echo "no comparison runner"; exit 0; fi
          uv run --python 3.14 python -m "$(dirname "$runner").benchmark" --seconds 1 --workers 2 --cpsat-grace 20

  vehicle-routing-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/vehicle-routing
    env:
      OPTIMARU_USE_CASES: vehicle_routing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.14 --extra dev
      - name: Test
        run: uv run --python 3.14 pytest -q
