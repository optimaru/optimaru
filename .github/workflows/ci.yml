name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPTIMARU_USE_CASES=none
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Engine license headers present
        run: python3 scripts/check_license_headers.py
      - uses: astral-sh/setup-uv@v5
      - name: Constraint-spec base and use-case lists (pure Python, no extension needed)
        run: uv run --no-project --python 3.14 --with pytest --with numpy python -m pytest -q tests/test_constraint.py tests/test_layout.py

  # The release path, which wheels.yml only exercises on a version bump: the sdist
  # must carry every source, and a wheel built from it must import.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the sdist
        run: uvx --python 3.14 --from build pyproject-build --sdist -o dist .
      - name: The sdist has every file a wheel build needs, and no tests
        run: python3 scripts/check_sdist.py dist/*.tar.gz
      - name: Build a wheel from the sdist (one extension) and import it
        env:
          OPTIMARU_USE_CASES: knapsack
        run: |
          uv run --no-project --python 3.14 --with pip python -m pip wheel --no-deps -w wheelhouse dist/*.tar.gz
          cd "$RUNNER_TEMP"
          uv run --no-project --python 3.14 --with "$GITHUB_WORKSPACE"/wheelhouse/*.whl --with pydantic \
            python -c "import optimaru, optimaru.knapsack as k; assert 'knapsack_capacity_cost' in k.list_constraints(); print(optimaru.__file__)"

  use-case-cpp:
    name: ${{ matrix.use_case }} (C++)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use_case:
          - assembly_line_balancing
          - bed_allocation
          - bin_packing
          - conference_scheduling
          - employee_scheduling
          - facility_location
          - flight_crew_scheduling
          - food_packaging
          - knapsack
          - maintenance_scheduling
          - max_cut
          - meeting_scheduling
          - order_picking
          - pickup_delivery
          - project_job_scheduling
          - quadratic_assignment
          - school_timetabling
          - semiconductor_scheduling
          - sports_league_scheduling
          - task_assigning
          - tournament_scheduling
          - vehicle_routing
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-${{ matrix.use_case }}
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DOPTIMARU_ENGINE_TESTS=OFF -DOPTIMARU_USE_CASES=${{ matrix.use_case }}
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  use-case-python:
    name: ${{ matrix.use_case }} (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use_case:
          - assembly_line_balancing
          - bed_allocation
          - bin_packing
          - conference_scheduling
          - employee_scheduling
          - facility_location
          - flight_crew_scheduling
          - food_packaging
          - knapsack
          - maintenance_scheduling
          - max_cut
          - meeting_scheduling
          - order_picking
          - pickup_delivery
          - project_job_scheduling
          - quadratic_assignment
          - school_timetabling
          - semiconductor_scheduling
          - sports_league_scheduling
          - task_assigning
          - tournament_scheduling
          - vehicle_routing
    env:
      # setup.py builds only this use case's extension.
      OPTIMARU_USE_CASES: ${{ matrix.use_case }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: py-${{ matrix.use_case }}
      - name: Install (builds the C++ extension)
        run: uv sync --python 3.14 --all-groups
        env:
          CC: ccache cc
          CXX: ccache c++
      - name: Test
        run: uv run --python 3.14 python -m pytest -q tests/${{ matrix.use_case }}

  benchmark-cpsat:
    name: ${{ matrix.benchmark }} (CP-SAT benchmark)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - cpsat-common
          - assembly-line-balancing
          - bed-allocation
          - bin-packing
          - conference-scheduling
          - employee-scheduling
          - facility-location
          - flight-crew-scheduling
          - food-packaging
          - knapsack
          - maintenance-scheduling
          - max-cut
          - meeting-scheduling
          - order-picking
          - pickup-delivery
          - project-job-scheduling
          - quadratic-assignment
          - school-timetabling
          - semiconductor-scheduling
          - sports-league-scheduling
          - task-assigning
          - tournament-scheduling
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bench-${{ matrix.benchmark }}
      - name: Locate the project
        run: |
          # setup.py builds only the benchmarked use case's extension
          # (cpsat-common is the shared runner, not a use case).
          slug="${{ matrix.benchmark }}"
          if [ "$slug" != cpsat-common ]; then echo "OPTIMARU_USE_CASES=${slug//-/_}" >> "$GITHUB_ENV"; fi
          if [ -f benchmarks/${{ matrix.benchmark }}/cpsat/pyproject.toml ]; then
            echo "PROJECT=benchmarks/${{ matrix.benchmark }}/cpsat" >> "$GITHUB_ENV"
          else
            echo "PROJECT=benchmarks/${{ matrix.benchmark }}" >> "$GITHUB_ENV"
          fi
      - name: Install (builds the engine extension)
        run: uv sync --project "$PROJECT" --python 3.14 --all-groups --all-extras
        env:
          CC: ccache cc
          CXX: ccache c++
      - name: Test
        working-directory: ${{ env.PROJECT }}
        run: uv run --python 3.14 --with pytest python -m pytest -q tests
      - name: Engine vs CP-SAT smoke run
        working-directory: ${{ env.PROJECT }}
        run: |
          runner=$(ls *_cpsat/benchmark.py 2>/dev/null | head -1)
          if [ -z "$runner" ]; then echo "no comparison runner"; exit 0; fi
          uv run --python 3.14 python -m "$(dirname "$runner").benchmark" --seconds 1 --workers 2 --cpsat-grace 20

  vehicle-routing-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/vehicle-routing
    env:
      OPTIMARU_USE_CASES: vehicle_routing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.14 --extra dev
      - name: Test
        run: uv run --python 3.14 pytest -q
