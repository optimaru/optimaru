# CVRPLIB Set X: the engine beside OR-Tools Routing and Timefold Solver.
#
# Same instances, fleet sizes, rounded integer distances, wall-clock budget
# and independent rescoring for every backend. Report, not a gate, on
# solution quality (gaps move with the runner); the only failure is the
# engine returning an incomplete plan.
name: vrp-public-bench

on:
  push:
    branches:
      - main
    # Only commits that can move the numbers: the engine, the VRP use case
    # and the benchmark itself.
    paths:
      - "include/**"
      - "use-cases/vehicle-routing/**"
      - "benchmarks/vehicle-routing/**"
      - ".github/workflows/vrp-public-bench.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Solve budget per instance per solver (seconds)"
        default: "60"
      limit_per_bucket:
        description: "Instances per size bucket (0 = all 100, ~300 min for three backends at 60s)"
        default: "1"
      backends:
        description: "Comma-separated backends (engine,ortools,timefold) or all"
        default: "all"

jobs:
  bench:
    runs-on: ubuntu-latest
    # One instance per bucket x three backends x 60s is ~15 minutes of solving.
    timeout-minutes: 350
    env:
      SECONDS_BUDGET: ${{ github.event.inputs.seconds || '60' }}
      LIMIT_PER_BUCKET: ${{ github.event.inputs.limit_per_bucket || '1' }}
      BACKENDS: ${{ github.event.inputs.backends || 'all' }}
    defaults:
      run:
        working-directory: benchmarks/vehicle-routing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: benchmarks/vehicle-routing/uv.lock

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache C++ compilation
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: vrp-public-bench-${{ runner.os }}

      - name: Install the benchmark project (builds the pybind extension)
        run: uv sync --python 3.14 --extra dev
        env:
          CC: ccache cc
          CXX: ccache c++

      - name: Build the Timefold runner
        run: mvn -B -q -f timefold/pom.xml package

      # Instance files only; --refresh-catalog re-reads the BKS every run so a
      # best-known-solution update is picked up.
      - name: Cache Set X instances
        uses: actions/cache@v4
        with:
          path: benchmarks/vehicle-routing/.bench-cache
          key: cvrplib-set-x-${{ hashFiles('benchmarks/vehicle-routing/vrp_benchmark/cvrplib.py') }}

      # --fail-on-incomplete inspects engine results and is refused without
      # the engine backend, so a dispatch without it runs as a report.
      - name: Run Set X
        run: |
          fail_on_incomplete=""
          case ",$(printf '%s' "$BACKENDS" | tr -d ' ')," in
            *,engine,*|*,all,*) fail_on_incomplete="--fail-on-incomplete" ;;
          esac
          uv run --python 3.14 python -m vrp_benchmark \
            --series x --limit-per-bucket "$LIMIT_PER_BUCKET" \
            --seconds "$SECONDS_BUDGET" --seed 0 \
            --backend "$BACKENDS" --catalog-source mirror --refresh-catalog \
            --cache-dir .bench-cache \
            --out bench/set-x.json --summary-markdown bench/set-x.md \
            $fail_on_incomplete

      - name: Publish summary
        if: always()
        run: |
          if [ -f bench/set-x.md ]; then
            cat bench/set-x.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark results were produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrp-set-x-${{ github.sha }}
          path: benchmarks/vehicle-routing/bench/
