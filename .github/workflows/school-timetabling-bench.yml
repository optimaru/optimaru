# Head-to-head solution-quality benchmark for the school-timetabling use case
#
#
# Gates:
#   1. C++ domain tests must pass (st_test + canonical_test, including the
#      incremental-vs-full and hot-set consistency checks).
#   2. Score-calculator parity: the fixed cross-check instance must produce the
#      same score on the C++ side and in the shared evaluator (evaluate.py).
# Report (not a gate), published to the job summary:
#   Track 1 — the quickstart's six constraints, identical instances solved by
#     this repo's C++ engine and OR-Tools CP-SAT;
#     every solution is re-scored by the shared evaluator (benchmarks/school-timetabling/evaluate.py).
#   Track 2 — the canonical full-constraint model (H1~H10 + S1~S6), the C++
#     canonical solver (st_timetabling) vs CP-SAT (teacher_scheduling); both
#     solutions are re-scored by the CP-SAT package's validate.py.
#   Track 3 — the same model with H1 relaxed (partial timetabling): a day is removed so
#     the periods no longer fit, and both solvers may leave lessons
#     unassigned. Track 2 asks "who packs a solvable instance better", track 3
#     asks "who gives up better" — the two regimes rank the solvers
#     differently, so both are reported.
name: school-timetabling-bench

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Solve budget per instance per solver (seconds)"
        default: "10"
  push:
    branches:
      - main
    paths:
      - "include/**"
      - "use-cases/school-timetabling/**"
      - "benchmarks/school-timetabling/**"
      - ".github/workflows/school-timetabling-bench.yml"
  pull_request:
    paths:
      - "include/**"
      - "use-cases/school-timetabling/**"
      - "benchmarks/school-timetabling/**"
      - ".github/workflows/school-timetabling-bench.yml"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECONDS_BUDGET: ${{ github.event.inputs.seconds || '10' }}
      QBENCH_DIR: ${{ github.workspace }}/qbench
      # Both the bench venv and the in-place pybind extension must use the
      # same interpreter ABI (the extension is imported from the source tree).
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v4

      - name: ccache (C++ compile cache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: st-bench-${{ runner.os }}

      - name: Build C++ (tests, cross-check, quality bench)
        run: |
          cmake -S use-cases/school-timetabling/cpp -B build/st -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/st -j

      - name: C++ test gates (st_test + canonical_test)
        run: |
          ./build/st/st_test
          ./build/st/canonical_test

      - name: C++ cross-check score
        run: |
          mkdir -p "$QBENCH_DIR"
          ./build/st/st_quality_bench crosscheck "$QBENCH_DIR/crosscheck.json" | tee cpp_crosscheck.txt

      - name: Install uv (with package cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            benchmarks/school-timetabling/uv.lock
            use-cases/school-timetabling/python/uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync the bench project (CP-SAT + shared evaluator deps)
        working-directory: benchmarks/school-timetabling
        run: uv sync --frozen

      - name: Build the st_timetabling extension in place (track-2 engine backend)
        # run_bench.py --track2 imports st_timetabling straight from the
        # source tree, so the pybind extension must sit next to the package.
        working-directory: use-cases/school-timetabling/python
        run: |
          uv sync --all-groups --frozen
          uv run python setup.py build_ext --inplace
        env:
          CC: ccache cc
          CXX: ccache c++

      - name: Track 1 — quickstart six constraints (C++ / CP-SAT)
        # Re-runs the cross-check parity gate internally, then solves the
        # S/M/L instances with both solvers and re-scores every solution
        # with the shared evaluator.
        working-directory: benchmarks/school-timetabling
        run: |
          uv run run_bench.py --sizes S,M,L --seconds "$SECONDS_BUDGET" \
            --cpp-bin "$GITHUB_WORKSPACE/build/st/st_quality_bench" \
            --out-dir "$QBENCH_DIR"

      - name: Track 2 — canonical full-parity model (C++ canonical vs CP-SAT)
        working-directory: benchmarks/school-timetabling
        run: |
          uv run run_bench.py --track2 --sizes S,M,L --seconds "$SECONDS_BUDGET" \
            --out-dir "$QBENCH_DIR"

      - name: Track 3 — partial solving with H1 relaxed (C++ canonical vs CP-SAT)
        working-directory: benchmarks/school-timetabling
        run: |
          uv run run_bench.py --track3 --sizes S,M,L --seconds "$SECONDS_BUDGET" \
            --out-dir "$QBENCH_DIR"

      - name: Publish comparison summary
        run: |
          {
            echo "# school-timetabling quality bench (${SECONDS_BUDGET}s per instance per solver)"
            echo ""
            echo "Cross-check parity: $(grep -o 'CROSSCHECK_SCORE=.*' cpp_crosscheck.txt)" \
              "(C++ / evaluate.py)"
            echo ""
            cat "$QBENCH_DIR/RESULTS_track1.md"
            echo ""
            cat "$QBENCH_DIR/RESULTS_track2.md"
            echo ""
            cat "$QBENCH_DIR/RESULTS_track3.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and instances
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st-bench-results
          path: |
            qbench/
            cpp_crosscheck.txt
