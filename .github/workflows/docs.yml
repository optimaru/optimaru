# The documentation site: mkdocs.yml, built from docs/ plus an API reference
# generated from the sources and the _core.pyi stubs (no compiled extension is
# needed), once for main (dev, strictly) and once per release minor, with a
# version selector (scripts/build_versioned_docs.py). A push to main also
# publishes it on GitHub Pages (Settings > Pages > Source: GitHub Actions), and
# so does a finished release: wheels.yml tags it after the release commit's
# push, so that push builds the site before the new tag exists.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "optimaru/**/*.py"
      - "optimaru/**/*.pyi"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "scripts/gen_docs_pages.py"
      - "scripts/mkdocs_hooks.py"
      - "scripts/build_versioned_docs.py"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "optimaru/**/*.py"
      - "optimaru/**/*.pyi"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "scripts/gen_docs_pages.py"
      - "scripts/mkdocs_hooks.py"
      - "scripts/build_versioned_docs.py"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  workflow_run:
    workflows: [wheels]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DISABLE_MKDOCS_2_WARNING: "true"
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    # After wheels.yml only when a push to main ran it to the end (it runs whenever pyproject.toml
    # changes, also on PRs, and publishes only when the version's tag is missing; a run that did not
    # publish just redeploys the same site).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags
      - uses: astral-sh/setup-uv@v5
      - name: Build (dev strict, every release minor)
        run: >-
          uv run --no-project --python 3.14 --with-requirements docs/requirements.txt
          python scripts/build_versioned_docs.py --strict --out site --site-url https://optimaru.github.io/optimaru/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    # One Pages deployment at a time; a newer push waits instead of cancelling it.
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
