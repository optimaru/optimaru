# Builds and publishes the `optimaru` Python distribution (sdist + wheels for
# Linux, macOS, Windows). It runs only when the version changes, so ordinary
# PRs do not pay for the full wheel matrix:
#   - on a PR whose pyproject.toml carries a different version than the base
#     branch, it builds everything (nothing is published), so a release that
#     breaks is caught before the merge;
#   - on a push to main whose version has no `v<version>` tag yet, it builds and
#     publishes;
#   - `workflow_dispatch` builds on demand (for example after editing this
#     workflow); run on main with an untagged version, it also publishes.
#
# Publishing:
#   1. uploads the sdist + wheels to PyPI, then
#   2. creates the `v<version>` tag on that commit and a GitHub release with the
#      same files attached.
# So to release: bump `version` in pyproject.toml in a PR and merge it.
#
# PyPI upload uses Trusted Publishing (OIDC) — there is no API token. The PyPI
# project lists this repository as a trusted publisher:
#   owner: optimaru · repository: optimaru · workflow: wheels.yml · environment: pypi
# and the GitHub Environment `pypi` must exist (add required reviewers there to
# gate uploads).
name: wheels

on:
  pull_request:
    paths:
      - pyproject.toml
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

# One release attempt at a time per ref; never cancel a publish half-way.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check for an existing tag
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            exists=true
          else
            exists=false
          fi
          # Publish only from main (push or manual run) with a version that has no tag yet.
          if { [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; } && [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${exists}" = "false" ]; then
            release=true
          else
            release=false
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          # Build when publishing, on demand, or on a PR that changes the version.
          build=${release}
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            build=true
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --quiet --depth=1 origin "${GITHUB_BASE_REF}"
            base=$(git show FETCH_HEAD:pyproject.toml | python3 -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])")
            if [ "${base}" != "${version}" ]; then build=true; fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "### optimaru ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "tag v${version} exists: ${exists} · build: ${build} · publish: ${release}" >> "$GITHUB_STEP_SUMMARY"

  wheels:
    needs: version
    if: needs.version.outputs.build == 'true'
    name: wheels (${{ matrix.os }}, ${{ matrix.python }}${{ startsWith(matrix.os, 'ubuntu') && format(' {0}', matrix.libc) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One job per OS x CPython version (and per libc on Linux), so the
      # builds run side by side instead of one after another in a single job.
      # Each job still compiles its 22 extensions in parallel (setup.py
      # ParallelCompile uses every core of the runner).
      matrix:
        # Native runners per architecture: no QEMU emulation, no cross-compiling.
        os:
          - ubuntu-latest      # x86_64
          - ubuntu-24.04-arm   # aarch64
          - macos-latest       # arm64
          - macos-15-intel     # x86_64
          - windows-latest     # AMD64
        python: [cp311, cp312, cp313, cp314]
        libc: [manylinux, musllinux]
        exclude:
          # macOS and Windows have no libc split: keep one job per version.
          - os: macos-latest
            libc: musllinux
          - os: macos-15-intel
            libc: musllinux
          - os: windows-latest
            libc: musllinux
    env:
      # Linux: cpXYZ-manylinux_* or cpXYZ-musllinux_*; macOS and Windows: cpXYZ-*.
      CIBW_BUILD: ${{ startsWith(matrix.os, 'ubuntu') && format('{0}-{1}_*', matrix.python, matrix.libc) || format('{0}-*', matrix.python) }}
    steps:
      - uses: actions/checkout@v4

      # Settings (skip list, smoke-test import of all use cases) live in
      # pyproject.toml [tool.cibuildwheel]; CIBW_BUILD above narrows each job to
      # one CPython version. v3.1 still shipped CPython 3.14.0rc2, on which
      # current pydantic fails to import (typing._eval_type signature).
      - uses: pypa/cibuildwheel@v4.3.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}${{ startsWith(matrix.os, 'ubuntu') && format('-{0}', matrix.libc) || '' }}
          path: wheelhouse/*.whl

  sdist:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build sdist
        run: pipx run build --sdist

      # The sdist must build on its own (all C++ sources included via MANIFEST.in).
      - name: Build a wheel from the sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w sdist-check dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish v${{ needs.version.outputs.version }}
    if: needs.version.outputs.release == 'true'
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    # Must match the environment registered as the trusted publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/optimaru/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write   # PyPI Trusted Publishing
      contents: write   # tag + GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release notes are the version's CHANGELOG.md section.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          path: src

      # Fails before anything is uploaded when the CHANGELOG has no section for
      # this version.
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "pip install optimaru==${VERSION} — https://pypi.org/project/optimaru/${VERSION}/"
            echo
            awk -v heading="## ${VERSION}" '$0 == heading {found = 1; next} /^## / {found = 0} found' src/CHANGELOG.md
          } > release-notes.md
          if [ "$(wc -l < release-notes.md)" -le 2 ]; then
            echo "CHANGELOG.md has no '## ${VERSION}' section" >&2
            exit 1
          fi

      # PyPI first: if the upload fails, no tag or release is created and the
      # next push to main retries.
      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "optimaru ${VERSION}" \
            --notes-file release-notes.md
