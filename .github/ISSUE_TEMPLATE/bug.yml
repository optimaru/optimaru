name: Bug report
description: A wrong result, a crash, or a solve that behaves differently than documented.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: optimaru version
      description: "`python -c 'import optimaru; print(optimaru.__version__)'`, or the commit of a source build."
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, CPU and Python version.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: "A small script, with a fixed `config.run.random_seed` and a `config.stop.step_limit`, so the solve is the same on every run. A bug that only shows under a time limit is welcome too: say so."
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
